        - article [ref=f2e168]:
          - generic [ref=f2e170]: "01"
          - generic [ref=f2e171]:
            - heading "A legacy to cherish" [level=3] [ref=f2e172]
            - paragraph [ref=f2e173]: Guided by Smt. Girija and the wisdom of her mentor, Smt. Rukmini Devi Arundale, we carry the grace and philosophy of Kalakshetra into every lesson.
            - paragraph [ref=f2e174]:
              - generic [ref=f2e175]: Smt. Girija Ravindranath
              - generic [ref=f2e176]: A living teaching tradition
        - article [ref=f2e177]:
          - generic [ref=f2e178]: "02"
          - generic [ref=f2e179]:
            - heading "Learning with purpose" [level=3] [ref=f2e180]
            - paragraph [ref=f2e181]: A thoughtfully structured, Kalakshetra-inspired curriculum, enriched by 23 years of teaching experience and the recognition of BSS certification.
            - paragraph [ref=f2e182]:
              - generic [ref=f2e183]: "23"
              - generic [ref=f2e184]:
                - generic [ref=f2e185]: years of teaching experience
                - generic [ref=f2e186]: Kalakshetra-inspired curriculum · BSS-certified
        - article [ref=f2e187]:
          - generic [ref=f2e188]: "03"
          - generic [ref=f2e189]:
            - heading "Wisdom beyond our walls" [level=3] [ref=f2e190]
            - paragraph [ref=f2e191]: Workshops and intimate learning sessions with renowned artists, where a lifetime of experience finds its way into eager young hearts.
        - article [ref=f2e192]:
          - generic [ref=f2e193]: "04"
          - generic [ref=f2e194]:
            - heading "The joy of the stage" [level=3] [ref=f2e195]
            - paragraph [ref=f2e196]: Our own productions and performances give every student the beautiful experience of bringing their learning to life before an audience.
        - article [ref=f2e197]:
          - generic [ref=f2e198]: "05"
          - generic [ref=f2e199]:
            - heading "Art that travels" [level=3] [ref=f2e200]
            - paragraph [ref=f2e201]: Through collaborations with like-minded institutions, we open doors to new perspectives, shared traditions, and the wider world of art.
        - article [ref=f2e202]:
          - generic [ref=f2e203]: "06"
          - generic [ref=f2e204]:
            - heading "Dreams beyond borders" [level=3] [ref=f2e205]
            - paragraph [ref=f2e206]: We aspire to take our students to national and international stages, where their years of devotion can find new audiences and possibilities.
        - article [ref=f2e207]:
          - generic [ref=f2e208]: "07"
          - generic [ref=f2e209]:
            - heading "A bond beyond Arangettam" [level=3] [ref=f2e210]
            - paragraph [ref=f2e211]: The relationship we share with our students continues long after their Arangettam. There is always a place to return to, an art to revisit, and a family that remembers.
        - article [ref=f2e212]:
          - generic [ref=f2e213]: "08"
          - generic [ref=f2e214]:
            - heading "A home steeped in tradition" [level=3] [ref=f2e215]
            - paragraph [ref=f2e216]: Beautiful traditional architecture, spacious surroundings, and an atmosphere that invites the mind to settle and the artist to flourish.
        - article [ref=f2e217]:
          - generic [ref=f2e218]: "09"
          - generic [ref=f2e219]:
            - heading "The beauty of every age" [level=3] [ref=f2e220]
            - paragraph [ref=f2e221]: From little feet discovering their first rhythm to graceful years enriched by Thiruvathira and yoga, we celebrate movement through every season of life. At Rtambhara, we hope every student leaves with something beautiful to carry, and a reason to return.
